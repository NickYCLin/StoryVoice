name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore StoryVoice.sln
      - run: dotnet build StoryVoice.sln --configuration Release --no-restore
      - run: dotnet test StoryVoice.sln --configuration Release --no-build --no-restore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/StoryVoice.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/StoryVoice.Web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run build
        env:
          STORYVOICE_BASE_PATH: /StoryVoice/

  books-com-tw-companion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/books-com-tw-companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/books-com-tw-companion/package-lock.json
      - run: npm ci
      - run: npm run check

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
