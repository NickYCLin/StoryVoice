<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StoryVoice 書櫃同步</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <span class="mark" aria-hidden="true">SV</span>
        <div>
          <p class="eyebrow">BOOKS.COM.TW COMPANION</p>
          <h1>同步博客來書櫃</h1>
        </div>
      </header>

      <p class="privacy">只讀取書櫃頁面已呈現的書名、作者、封面與官方連結；不讀取帳密、Cookie，不進入閱讀器或擷取電子書內文。</p>

      <label for="storyvoice-origin">StoryVoice 位址</label>
      <input id="storyvoice-origin" type="url" value="http://localhost:3000" autocomplete="off" spellcheck="false" />

      <div class="toolbar">
        <strong id="count">尚未掃描</strong>
        <span class="toolbar-actions">
          <button id="scan" class="ghost" type="button">目前頁面</button>
          <button id="crawl" class="ghost" type="button">展開完整書櫃</button>
        </span>
      </div>

      <section id="book-list" class="book-list" aria-label="可同步書籍"></section>
      <p id="status" class="status" role="status" aria-live="polite">請先在博客來登入並開啟電子書櫃。</p>

      <button id="sync" class="primary" type="button" disabled>同步勾選書籍</button>
      <a class="shelf-link" href="https://viewer-ebook.books.com.tw/viewer/index.html?readlist=all" rel="noreferrer" target="_blank">開啟博客來電子書櫃 ↗</a>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
