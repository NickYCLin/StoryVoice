<!doctype html>
<html lang="zh-TW">
  <head><meta charset="utf-8"><title>Books.com.tw extractor fixture</title></head>
  <body>
    <div class="bookshelf__main">
      <article class="book-item" data-book-uni-id="E050145360">
        <a href="https://viewer-ebook.books.com.tw/viewer/epub_v3/?book_uni_id=E050145360" title="立即閱讀">
          <img src="https://im1.book.com.tw/image/getImage?i=E050145360" alt="月下的故事">
        </a>
        <h3 class="book-title">月下的故事</h3>
        <p class="book-author">比比工程師</p>
      </article>
      <li class="book-item">
        <a href="https://www.books.com.tw/products/E050145361">
          <img src="https://im2.book.com.tw/image/getImage?i=E050145361" alt="火蝶的故事">
        </a>
        <span class="title">火蝶的故事</span>
      </li>
    </div>
    <output id="result"></output>
    <script src="../extractor.js"></script>
    <script>
      document.querySelector('#result').textContent = JSON.stringify(
        globalThis.StoryVoiceBooksComTwExtractor.extractBooks(document)
      )
    </script>
  </body>
</html>
