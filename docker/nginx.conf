server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;

    location = /StoryVoice {
        return 308 /StoryVoice/;
    }

    location = /StoryVoice/api/external/v1/speech {
        access_log off;
        client_max_body_size 4k;
        client_body_buffer_size 4k;
        error_page 413 = @external_voice_request_too_large;
        rewrite ^/StoryVoice(/.*)$ $1 break;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /StoryVoice;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ASP.NET routing is case-insensitive and accepts a trailing slash. Reject
    # those non-canonical spellings before the generic 11 MiB proxy can buffer
    # their bodies; the exact lowercase location above remains the only API path.
    location ~* ^/StoryVoice/api/external/v1/speech/?$ {
        access_log off;
        client_max_body_size 4k;
        client_body_buffer_size 4k;
        default_type application/problem+json;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        return 400 '{"type":"about:blank","title":"Invalid request","status":400,"detail":"Use the canonical external voice API path.","code":"invalid_request"}';
    }

    location /StoryVoice/api/ {
        rewrite ^/StoryVoice(/.*)$ $1 break;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /StoryVoice;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /StoryVoice/health/ {
        rewrite ^/StoryVoice(/.*)$ $1 break;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /StoryVoice;
    }

    location /StoryVoice/ {
        rewrite ^/StoryVoice(/.*)$ $1 break;
        try_files $uri $uri/ /index.html;
    }

    location = /api/external/v1/speech {
        access_log off;
        client_max_body_size 4k;
        client_body_buffer_size 4k;
        error_page 413 = @external_voice_request_too_large;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix $http_x_forwarded_prefix;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~* ^/api/external/v1/speech/?$ {
        access_log off;
        client_max_body_size 4k;
        client_body_buffer_size 4k;
        default_type application/problem+json;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        return 400 '{"type":"about:blank","title":"Invalid request","status":400,"detail":"Use the canonical external voice API path.","code":"invalid_request"}';
    }

    location @external_voice_request_too_large {
        access_log off;
        default_type application/problem+json;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        return 413 '{"type":"about:blank","title":"Request too large","status":413,"detail":"The request body exceeds the configured limit.","code":"request_too_large"}';
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix $http_x_forwarded_prefix;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix $http_x_forwarded_prefix;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
